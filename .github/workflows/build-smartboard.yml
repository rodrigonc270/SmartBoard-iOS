
name: SmartBoard - Testar compilacao iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Compilar SmartBoard
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verificar ambiente
        run: |
          xcodebuild -version
          swift --version

      - name: Identificar projetos e schemes
        run: |
          xcodebuild -list \
            -project Demo/Demo.xcodeproj

      - name: Resolver dependencias
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Demo/Demo.xcodeproj

      - name: Compilar aplicativo de demonstracao
        run: |
          set -o pipefail

          xcodebuild build \
            -project Demo/Demo.xcodeproj \
            -scheme Demo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Salvar log de compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartboard-build-log
          path: build.log
          if-no-files-found: ignore
