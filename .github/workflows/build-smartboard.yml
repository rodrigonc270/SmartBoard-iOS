
name: SmartBoard - Testar compilacao iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Compilar OpenKeyboardKit para iOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verificar ambiente
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Resolver dependencias
        run: |
          swift package resolve

      - name: Listar schemes disponiveis
        run: |
          xcodebuild -list \
            -packagePath .

      - name: Compilar OpenKeyboardKit para iOS
        run: |
          set -o pipefail

          xcodebuild build \
            -scheme OpenKeyboardKit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SmartBoardBuild" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Salvar log de compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartboard-ios-build-log
          path: build.log
          if-no-files-found: ignore
